# Cut a release tag via github-actions[bot].
#
# WHY THIS EXISTS (2026-07-07): this repo rejects direct creation of stable
# semver tag refs (vX.Y.Z) for every user/App actor with GH013 "creations
# being restricted", while the rules API reports zero rules for the ref — a
# platform-side inconsistency unique to this repo (owner confirmed no rule was
# configured; suffixed tags push fine). github-actions[bot] demonstrably CAN
# create them (v0.1.3, 2026-07-04). This dispatch cuts the GitHub Release
# (creating the tag), which is also this repo's release.yml trigger vintage
# (release-published). Guard: tag must equal v<package.json version>.
name: cut-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must equal v<package.json version>)"
        required: true
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.1
      - name: verify tag == v<package.json version>
        env:
          TAG: ${{ inputs.tag }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$V" ]; then
            echo "::error::tag '$TAG' != package.json version '$V'"; exit 1
          fi
      - name: create the release (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Release $TAG (cut via cut-release dispatch; see workflow header for why)."
